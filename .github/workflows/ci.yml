name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-docs:
    # 静态 lane：文档门禁内嵌在这里（doc-sync 全量），文档与门禁没有旁路。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 测试（门禁自测 + 原型 + workspace 自动化测试）
        run: pnpm test
      - name: 生产构建（shared/server/cli/web）
        run: pnpm build
      - name: 文档门禁（doc-sync）
        run: pnpm verify:docs
      - name: 开发流程门禁（PR diff）
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-flow.mjs --diff origin/${{ github.base_ref }}

  windows-storage:
    # Windows 门禁：只读句柄 fsync 在 FlushFileBuffers 上返回 EPERM，会让 revision 追加失败并表现为保存 500。
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生产构建（shared/server/cli/web）
        run: pnpm build
      - name: 存储持久化（Windows 写句柄与 fsync）
        run: pnpm exec vitest run tests/storage/jsonl.spec.ts tests/storage/atomic-json.spec.ts

  flow-online:
    # 在线 lane：流程树与 GitHub 双侧一致（只校验；写 GitHub 的唯一入口是 pnpm flow:sync）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 流程树与 GitHub 一致性
        env:
          GH_TOKEN: ${{ secrets.FLOW_TOKEN || secrets.GITHUB_TOKEN }}
          FLOW_PROJECT_CHECK: ${{ secrets.FLOW_TOKEN && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/verify-flow-online.mjs
